[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-paper-trader"
version = "0.1.0"
description = "Local supervised learning research and Alpaca paper-only execution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alpaca-py==0.44.0",
  "pandas==3.0.6",
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "exchange-calendars==4.13.2",
  "streamlit==1.65.0",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
paper-trader = "paper_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
